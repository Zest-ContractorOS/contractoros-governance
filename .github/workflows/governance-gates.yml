name: contractoros-governance-gates

# Zero external actions by design: this repository enforces sha_pinning_required
# and a selected-actions policy (H1-B0 hardening). Checkout is performed with
# plain git and the ephemeral workflow token; Python and pip are preinstalled
# on the runner. Supply-chain surface: none beyond the runner image itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus-gates:
    name: Corpus validation + full-tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout via git (no external actions)
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Install pinned schema validator dependency
        run: python3 -m pip install --quiet jsonschema==4.26.0

      - name: Corpus schema and rule validation (VALIDATOR)
        run: python3 scripts/validate_corpus.py

      - name: Full-tree classification scan (FULL_TREE_SCANNER)
        run: python3 scripts/scan_tree.py

      - name: Adversarial probe suite (H1-B2 TEST vs EXPECTED_ORACLE)
        run: python3 tests/adversarial/probes.py
