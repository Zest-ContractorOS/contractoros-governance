name: contractoros-governance-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus-gates:
    name: Corpus validation + full-tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned schema validator dependency
        run: pip install jsonschema==4.26.0

      - name: Corpus schema and rule validation (VALIDATOR)
        run: python3 scripts/validate_corpus.py

      - name: Full-tree classification scan (FULL_TREE_SCANNER)
        run: python3 scripts/scan_tree.py
